name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e ".[dev]"
      - name: Test
        run: pytest
      - name: Run all benchmark baselines
        run: python -m ctrag.benchmarks
      - name: Generate research artifacts
        run: python -m ctrag.research_artifacts --benchmark-dir benchmark-results --out research-artifacts --k 3
      - name: Upload reproducible benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: benchmarks-python-${{ matrix.python-version }}
          path: benchmark-results/
      - name: Upload paper-ready research artifacts
        uses: actions/upload-artifact@v4
        with:
          name: research-artifacts-python-${{ matrix.python-version }}
          path: research-artifacts/
