name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e ".[dev]"
      - name: Test
        run: pytest
      - name: Scientific change gate
        run: python -m ctrag.science_gate
      - name: Run v0.1 regression benchmark
        run: python -m ctrag.benchmarks --output benchmark-results/regression
      - name: Run chronological dynamic-terrain experiment
        run: python -m ctrag.benchmarks.terrain_dynamics --output benchmark-results/terrain-dynamics
      - name: Run early behavioral degradation experiment
        run: python -m ctrag.benchmarks.early_behavioral_degradation --output benchmark-results/early-behavioral-degradation
      - name: Run early degradation robustness suite
        run: python -m ctrag.benchmarks.early_degradation_robustness --output benchmark-results/early-degradation-robustness
      - name: Run MAPE-K observability experiment
        run: python -m ctrag.benchmarks.mape_k_observability --output benchmark-results/mape-k-observability
      - name: Run Phase 2 train split
        run: python -m ctrag.benchmarks.holdout run train --output benchmark-results/train
      - name: Run Phase 2 dev split
        run: python -m ctrag.benchmarks.holdout run dev --output benchmark-results/dev
      - name: Fingerprint sealed final test without retrieval
        run: python -m ctrag.benchmarks.holdout fingerprint test
      - name: Run commercial root-cause experiment
        run: python -m ctrag.experiments.commercial_system --output commercial-experiment
      - name: Generate research artifacts from dev only
        run: python -m ctrag.research_artifacts --benchmark-dir benchmark-results/dev --out research-artifacts --k 3
      - name: Upload reproducible non-test benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: benchmarks-python-${{ matrix.python-version }}
          path: benchmark-results/
      - name: Upload paper-ready dev research artifacts
        uses: actions/upload-artifact@v4
        with:
          name: research-artifacts-python-${{ matrix.python-version }}
          path: research-artifacts/
      - name: Upload commercial root-cause evidence
        uses: actions/upload-artifact@v4
        with:
          name: commercial-experiment-python-${{ matrix.python-version }}
          path: commercial-experiment/
