name: Science Strong Baselines

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/ctrag/adapters.py"
      - "src/ctrag/benchmarks/strong_baselines.py"
      - "src/ctrag/benchmarks/anchor_discovery.py"
      - "src/ctrag/benchmarks/graphrag_baseline.py"
      - "src/ctrag/benchmarks/basinrag_reproduction.py"
      - "src/ctrag/benchmarks/datasets.py"
      - "src/ctrag/benchmarks/metrics.py"
      - "src/ctrag/benchmarks/holdout.py"
      - "research/holdout/manifest-v1.json"
      - "docs/PREREGISTRATION.md"
      - "pyproject.toml"
      - ".github/workflows/science-strong-baselines.yml"

jobs:
  strong-baselines:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Cache Hugging Face models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-ctrag-strong-v1-1110a243-e8c3b32
      - name: Install science dependencies
        run: |
          pip install -e ".[dev,science]"
          pip install "git+https://github.com/Basinfy/BasinRAG.git@fb62771eda11f1a70d6e99ca7aa5e19b9825b829"
      - name: Verify pinned BasinRAG import
        run: |
          python - <<'PY'
          from basinrag.factory import BasinRAGConfig
          config = BasinRAGConfig()
          assert config.hybrid_alpha == 0.55
          assert config.rrf_k == 60
          print("Pinned BasinRAG import OK", config.encoder_model)
          PY
      - name: Unit and scientific gates
        run: |
          pytest
          python -m ctrag.science_gate
          python -m ctrag.benchmarks.holdout fingerprint test
      - name: Run strong train baselines
        env:
          TOKENIZERS_PARALLELISM: "false"
        run: python -m ctrag.benchmarks.strong_baselines train --output strong-baseline-results/train
      - name: Run strong dev baselines
        env:
          TOKENIZERS_PARALLELISM: "false"
        run: python -m ctrag.benchmarks.strong_baselines dev --output strong-baseline-results/dev
      - name: Run no-oracle anchor train track
        env:
          TOKENIZERS_PARALLELISM: "false"
        run: python -m ctrag.benchmarks.anchor_discovery train --output anchor-discovery-results/train
      - name: Run no-oracle anchor dev track
        env:
          TOKENIZERS_PARALLELISM: "false"
        run: python -m ctrag.benchmarks.anchor_discovery dev --output anchor-discovery-results/dev
      - name: Run matched GraphRAG train comparison
        env:
          TOKENIZERS_PARALLELISM: "false"
        run: python -m ctrag.benchmarks.graphrag_baseline train --output graphrag-results/train
      - name: Run matched GraphRAG dev comparison
        env:
          TOKENIZERS_PARALLELISM: "false"
        run: python -m ctrag.benchmarks.graphrag_baseline dev --output graphrag-results/dev
      - name: Reproduce upstream BasinRAG train comparison
        env:
          TOKENIZERS_PARALLELISM: "false"
        run: python -m ctrag.benchmarks.basinrag_reproduction train --output basinrag-results/train
      - name: Reproduce upstream BasinRAG dev comparison
        env:
          TOKENIZERS_PARALLELISM: "false"
        run: python -m ctrag.benchmarks.basinrag_reproduction dev --output basinrag-results/dev
      - name: Verify final holdout is still sealed
        run: |
          test ! -f research/holdout/UNBLINDED.json
          python -m ctrag.benchmarks.holdout fingerprint test
      - name: Upload strong-baseline evidence
        uses: actions/upload-artifact@v4
        with:
          name: strong-baselines-python-3.12
          path: strong-baseline-results/
      - name: Upload no-oracle anchor evidence
        uses: actions/upload-artifact@v4
        with:
          name: anchor-discovery-python-3.12
          path: anchor-discovery-results/
      - name: Upload matched GraphRAG evidence
        uses: actions/upload-artifact@v4
        with:
          name: graphrag-comparison-python-3.12
          path: graphrag-results/
      - name: Upload BasinRAG reproduction evidence
        uses: actions/upload-artifact@v4
        with:
          name: basinrag-reproduction-python-3.12
          path: basinrag-results/
