[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "causal-topological-rag"
version = "0.1.0"
description = "Research prototype for causal-topological retrieval over stateful execution memory"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "suissa"}]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.3", "numpy>=1.26"]
science = [
  "rank-bm25==0.2.2",
  "sentence-transformers==6.0.1",
]

[tool.setuptools]
package-dir = "src"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
